<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://cmcooking.cmcooking.workers.dev; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#0f3d3e">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>CMCOOKING Pain Point</title>
<style>
:root{--g:#B2D235;--o:#F58220;--bg:#07090a;--card:#0f1512;--ink:#e8f0e4;--mut:#8fa196;--line:#22302a;--soft:#16201b;--err:#ff5c5c;--glow:0 0 12px #B2D23566;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Noto Sans Thai","Sarabun",sans-serif;padding-bottom:env(safe-area-inset-bottom)}
.hide{display:none!important}
[hidden]{display:none!important}
#bar{position:fixed;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--g),transparent) no-repeat;background-size:50% 100%;animation:slide 1s linear infinite;opacity:0;transition:opacity .15s;z-index:9;pointer-events:none}
#bar.on{opacity:1}
@keyframes slide{from{background-position:-50% 0}to{background-position:150% 0}}
header{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:12px 16px;background:#060807;border-bottom:2px solid var(--g);box-shadow:0 2px 16px #B2D23540}
.mark{width:36px;height:36px;flex:none;border-radius:10px;border:1.5px solid var(--g);box-shadow:var(--glow);display:grid;place-items:center;color:var(--g);font-weight:800}
.ttl{flex:1;min-width:0}
header h1{margin:0;font-size:19px;letter-spacing:1.5px;color:var(--g);text-shadow:0 0 10px #B2D235aa}
header small{display:block;font-size:12px;color:var(--mut)}
.exit{background:transparent;color:var(--mut);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12px;box-shadow:none}
nav.nav{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;border-bottom:1px solid var(--line);background:#0a0e0c;scrollbar-width:none}
nav.nav a{flex:none;display:inline-flex;align-items:center;padding:7px 12px;border:1px solid var(--line);border-radius:10px;color:var(--mut);text-decoration:none;font-size:13px;font-weight:600}
nav.nav a.on{border-color:var(--g);color:var(--g);box-shadow:0 0 10px #B2D23540}
.badge{display:inline-block;min-width:20px;text-align:center;margin-left:6px;padding:0 6px;border-radius:10px;background:var(--o);color:#1a0b00;font-size:12px;font-weight:800;box-shadow:0 0 8px #F5822099}
main{max-width:720px;margin:auto;padding:14px 16px 90px}
.hint{color:var(--mut);font-size:13px;margin:0 0 12px}
#msg{color:var(--err);min-height:1.5em;margin:0 0 8px}
#msg.ok{color:var(--g)}
input,select{font:inherit;color:var(--ink);width:100%;padding:12px;background:#0a0f0c;border:1px solid var(--line);border-radius:10px;margin:4px 0 12px}
input:focus,select:focus{outline:2px solid var(--o);outline-offset:1px}
label{font-size:13px;color:var(--mut)}
button{font:inherit;font-weight:700;color:var(--g);background:transparent;border:1.5px solid var(--g);border-radius:12px;padding:10px 14px;cursor:pointer;box-shadow:0 0 10px #B2D23540}
button:focus-visible,a:focus-visible{outline:2px solid var(--o);outline-offset:2px}
button:disabled{opacity:.45;box-shadow:none}
button.ghost{color:var(--ink);border-color:var(--line);box-shadow:none}
button.del{color:var(--err);border-color:var(--err);box-shadow:none}
button.solid{background:var(--g);color:#071004}
button.solid.del{background:var(--err);color:#1a0303;border-color:var(--err)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));background:var(--o);color:#1a0b00;border-color:var(--o);box-shadow:0 0 18px #F58220aa;border-radius:28px;padding:14px 20px}
.empty{color:var(--mut);text-align:center;padding:32px 0}
#dlg{position:fixed;inset:0;z-index:30;background:#000c;display:flex;align-items:center;justify-content:center;padding:20px}
#dlg .box{background:var(--card);border:1px solid var(--g);box-shadow:0 0 22px #B2D23533;border-radius:16px;padding:18px;width:100%;max-width:380px;max-height:90vh;overflow:auto}
#dlg h2{font-size:18px;color:var(--g);margin:0 0 10px}
#dlg p{margin:0 0 12px;overflow-wrap:anywhere;white-space:pre-line}
#dlgE{color:var(--err);min-height:1.2em;margin:0 0 8px;font-size:14px}

.g{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:12px 0;overflow:hidden}
.gh{display:flex;align-items:center;gap:6px;padding:10px 12px;background:var(--soft);border-bottom:1px solid var(--line);flex-wrap:wrap}
.gh b{flex:1;min-width:120px;font-size:17px;color:var(--g);text-shadow:0 0 10px #B2D23566;overflow-wrap:anywhere}
.s{display:flex;align-items:center;gap:6px;padding:8px 12px;border-top:1px solid var(--line);flex-wrap:wrap}
.s.off{opacity:.5}
.dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none}
.sn{flex:1;min-width:140px;overflow-wrap:anywhere}
.tag{display:inline-block;padding:0 8px;border-radius:10px;background:var(--err);color:#fff;font-size:12px;font-weight:700;margin-left:6px}
.sm{padding:6px 10px;font-size:13px;white-space:nowrap;border-radius:10px}
.mv{padding:5px 9px;font-size:13px;line-height:1;border-radius:10px}
.sw{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 14px;align-items:center}
.sw button{width:38px;height:38px;border-radius:50%;padding:0;border:3px solid transparent;box-shadow:none}
.sw button.on{border-color:#fff}
.sw input{width:44px;height:38px;padding:0;margin:0;border-radius:8px}
</style>
</head>
<body>
<div id="bar"></div>
<header><div class="mark">T</div><div class="ttl"><h1>Pain Point</h1><small>CMCOOKING · เฉพาะผู้ดูแล</small></div><button id="out" class="exit" type="button">EXIT</button></header>
<nav class="nav" aria-label="เมนูผู้ดูแล"><a href="admin.html">HOME</a><a href="pp.html">Pain Point</a><a href="stats.html">Stats</a><a href="users.html">Users</a><a href="approve.html">อนุมัติ<span class="badge hide" id="apBadge"></span></a></nav>
<main>
<p id="msg" role="alert"></p>

<section id="vPP">
  <p class="hint" id="cap"></p>
  <div id="list"></div>
  <button id="add" class="fab">+ เพิ่มหมวกหลัก</button>
</section>
</main>

<div id="dlg" class="hide" role="dialog" aria-modal="true" aria-labelledby="dlgT">
  <div class="box">
    <h2 id="dlgT"></h2>
    <p id="dlgM"></p>
    <div id="fMain"><label for="mn">หมวกหลัก (1-40 ตัวอักษร)</label><input id="mn" maxlength="40" autocomplete="off"></div>
    <div id="fSub"><label for="sb">ตัวรอง (1-40 ตัวอักษร)</label><input id="sb" maxlength="40" autocomplete="off"></div>
    <div id="fCol"><label>สีที่แสดงใน CMList</label><div class="sw" id="sw"></div></div>
    <p id="dlgE" role="alert"></p>
    <div class="two"><button id="dlgNo" class="ghost">ยกเลิก</button><button id="dlgYes">ตกลง</button></div>
  </div>
</div>

<script>
if (window.top !== window.self) { document.documentElement.textContent = ''; throw new Error('framed'); }   // กันถูกฝังในเว็บอื่น (clickjacking)
const API = 'https://cmcooking.cmcooking.workers.dev/';   // Worker API
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let token = null, me = null, pending = 0;   // อ่านจาก sessionStorage ของแท็บนี้ (ใช้ร่วมกับหน้าเข้าสู่ระบบ)
try { token = sessionStorage.getItem('t'); me = JSON.parse(sessionStorage.getItem('u') || 'null'); } catch (e) { token = null; me = null; }
if (!token || !me || me.role !== 'admin' || me.mustChange) { location.replace('index.html'); throw new Error('no-session'); }   // ต้องเข้าผ่านหน้าเข้าสู่ระบบก่อน
function say(t, ok){ $('msg').textContent = t || ''; $('msg').className = ok ? 'ok' : ''; }
function bye(){ if (token) fetch(API, {method:'POST', body: JSON.stringify({action:'logout', token})}).catch(() => {}); }   // ยกเลิกเซสชันฝั่งเซิร์ฟเวอร์
function endSession(m){ bye(); token = null; me = null; try { sessionStorage.clear(); if (m) sessionStorage.setItem('flash', m); } catch (e) {} location.replace('index.html'); }
$('out').onclick = () => endSession('');
function badge(n){ const b = $('apBadge'); if (b) { b.textContent = n; b.classList.toggle('hide', !n); } }
(function markNav(){ const here = location.pathname.split('/').pop() || 'admin.html'; document.querySelectorAll('nav.nav a').forEach(a => a.classList.toggle('on', a.getAttribute('href') === here)); })();
async function api(action, data = {}){
  pending++; $('bar').classList.add('on');
  try{
    const r = await fetch(API, {method:'POST', body: JSON.stringify({action, token, ...data})});
    const j = await r.json();
    if (j.auth) endSession(j.error);
    return j;
  }catch(e){ return {ok:false, error:'เชื่อมต่อไม่ได้ ตรวจสอบสัญญาณแล้วลองใหม่'}; }
  finally{ if (--pending <= 0) { pending = 0; $('bar').classList.remove('on'); } }
}
async function busy(b, txt, fn){
  const old = b.textContent; b.disabled = true; b.textContent = txt;
  try{ return await fn(); } finally { b.disabled = false; b.textContent = old; }
}
function pendingBadge(){ api('req_list').then(j => { if (j.ok) badge(j.items.length); }); }
const HEX = /^#[0-9a-fA-F]{6}$/;
const PAL = [['เขียว','#43A047'],['ส้ม','#F58220'],['แดง','#D93025'],['เหลือง','#F2C200'],['ฟ้า','#1E88E5'],['ม่วง','#8E44AD'],['ชมพู','#D81B60'],['เทา','#8A8F98']];
let items = [], groups = [], col = '#8A8F98';

async function load(){
  $('list').innerHTML = '<p class="empty">กำลังโหลด…</p>';
  const j = await api('pp_list');
  if (!j.ok) { $('list').innerHTML = ''; return say(j.error); }
  items = j.items; draw();
}

/* จัดกลุ่มตามหมวกหลัก (ลำดับจากเซิร์ฟเวอร์) */
function draw(){
  const idx = {}; groups = [];
  items.forEach((p, i) => {
    const k = p.main.toLowerCase();
    if (!(k in idx)) { idx[k] = groups.length; groups.push({main: p.main, subs: []}); }
    groups[idx[k]].subs.push(i);
  });
  const on = items.filter(p => p.active).length;
  $('cap').textContent = groups.length + ' หมวกหลัก · ' + items.length + ' ตัวรอง (ใช้งาน ' + on + ') · เข้าสู่ระบบเป็น ' + me.name;
  $('list').innerHTML = groups.length ? groups.map((g, gi) => `<div class="g">
    <div class="gh"><b>${esc(g.main)}</b>
      <button class="ghost mv" data-a="gup" data-g="${gi}" title="เลื่อนหมวกขึ้น" ${gi === 0 ? 'disabled' : ''}>▲</button>
      <button class="ghost mv" data-a="gdn" data-g="${gi}" title="เลื่อนหมวกลง" ${gi === groups.length - 1 ? 'disabled' : ''}>▼</button>
      <button class="ghost sm" data-a="ren" data-g="${gi}">เปลี่ยนชื่อ</button>
      <button class="sm" data-a="sub" data-g="${gi}">+ ตัวรอง</button></div>
    ${g.subs.map((i, si) => { const p = items[i]; return `<div class="s ${p.active ? '' : 'off'}">
      <span class="dot" style="background:${HEX.test(p.color) ? p.color : '#8A8F98'}"></span>
      <span class="sn">${esc(p.sub)}${p.active ? '' : '<span class="tag">ปิดใช้งาน</span>'}</span>
      <button class="ghost mv" data-a="up" data-i="${i}" title="เลื่อนขึ้น" ${si === 0 ? 'disabled' : ''}>▲</button>
      <button class="ghost mv" data-a="dn" data-i="${i}" title="เลื่อนลง" ${si === g.subs.length - 1 ? 'disabled' : ''}>▼</button>
      <button class="ghost sm" data-a="ed" data-i="${i}">แก้ไข</button>
      <button class="${p.active ? 'del' : 'ghost'} sm" data-a="act" data-i="${i}">${p.active ? 'ปิด' : 'เปิด'}</button></div>`; }).join('')}
  </div>`).join('') : '<p class="empty">ยังไม่มี Pain Point · กด “+ เพิ่มหมวกหลัก”</p>';
}

/* ---------- กล่องโต้ตอบ ---------- */
let dlgSubmit = null;
function closeDlg(){ $('dlg').classList.add('hide'); dlgSubmit = null; $('mn').value = ''; $('sb').value = ''; }
function paint(){
  $('sw').innerHTML = PAL.map(c => `<button type="button" class="${c[1] === col ? 'on' : ''}" data-c="${c[1]}" style="background:${c[1]}" aria-label="${esc(c[0])}" title="${esc(c[0])}"></button>`).join('')
    + `<input type="color" id="cc" value="${col.toLowerCase()}" aria-label="เลือกสีเอง" title="เลือกสีเอง">`;
}
$('sw').onclick = e => { const b = e.target.closest('button[data-c]'); if (b) { col = b.dataset.c; paint(); } };
$('sw').oninput = e => { if (e.target.id === 'cc' && HEX.test(e.target.value)) col = e.target.value.toUpperCase(); };
$('sw').onchange = e => { if (e.target.id === 'cc') paint(); };

/* cfg: {title,msg,main,sub,color,mainVal,subVal,colorVal,yes,danger,run(values)->Promise<{ok,error,items}>} */
function dlg(cfg){
  $('dlgT').textContent = cfg.title; $('dlgM').textContent = cfg.msg || ''; $('dlgM').classList.toggle('hide', !cfg.msg);
  $('fMain').classList.toggle('hide', !cfg.main); $('fSub').classList.toggle('hide', !cfg.sub); $('fCol').classList.toggle('hide', !cfg.color);
  $('mn').value = cfg.mainVal || ''; $('sb').value = cfg.subVal || ''; $('dlgE').textContent = '';
  col = HEX.test(cfg.colorVal) ? cfg.colorVal.toUpperCase() : '#43A047'; if (cfg.color) paint();
  const y = $('dlgYes'); y.textContent = cfg.yes || 'ตกลง'; y.className = cfg.danger ? 'del' : ''; y.disabled = false;
  $('dlg').classList.remove('hide');
  (cfg.main ? $('mn') : cfg.sub ? $('sb') : y).focus();
  dlgSubmit = async () => {
    const v = {main: $('mn').value.trim(), sub: $('sb').value.trim(), color: col};
    $('dlgE').textContent = ''; y.disabled = true; const old = y.textContent; y.textContent = 'กำลังบันทึก…';
    const j = await cfg.run(v);
    y.disabled = false; y.textContent = old;
    if (!j.ok) { $('dlgE').textContent = j.error || 'ไม่สำเร็จ'; return; }
    items = j.items; draw(); closeDlg(); say('บันทึกแล้ว', true);
  };
}
$('dlgYes').onclick = () => dlgSubmit && dlgSubmit();
$('dlgNo').onclick = closeDlg;
document.addEventListener('keydown', e => {
  if ($('dlg').classList.contains('hide')) return;
  if (e.key === 'Escape') closeDlg();
  else if (e.key === 'Enter' && e.target.tagName === 'INPUT' && e.target.type === 'text') $('dlgYes').click();
});

async function act(action, data){      /* คำสั่งที่ไม่ต้องใช้กล่อง: เลื่อนลำดับ */
  say(); const j = await api(action, data);
  if (!j.ok) return say(j.error);
  items = j.items; draw();
}

$('add').onclick = () => dlg({
  title: 'เพิ่มหมวกหลักใหม่', msg: 'ต้องมีตัวรองอย่างน้อย 1 ตัว (เพิ่มตัวอื่นภายหลังได้)', main: true, sub: true, color: true, yes: 'เพิ่ม',
  run: v => api('pp_save', {main: v.main, sub: v.sub, color: v.color})
});

$('list').onclick = e => {
  const b = e.target.closest('button[data-a]'); if (!b || b.disabled) return;
  const a = b.dataset.a, g = groups[+b.dataset.g], p = items[+b.dataset.i];
  if (a === 'gup' && g) act('pp_move', {main: g.main, dir: -1});
  else if (a === 'gdn' && g) act('pp_move', {main: g.main, dir: 1});
  else if (a === 'up' && p) act('pp_move', {id: p.id, dir: -1});
  else if (a === 'dn' && p) act('pp_move', {id: p.id, dir: 1});
  else if (a === 'ren' && g) dlg({
    title: 'เปลี่ยนชื่อหมวกหลัก', msg: 'ใช้กับทุกตัวรองในหมวกนี้ · รายการที่บันทึกไปแล้วยังนับสถิติถูกต้อง', main: true, mainVal: g.main, yes: 'บันทึก',
    run: v => v.main.toLowerCase() === g.main.toLowerCase() && v.main === g.main ? Promise.resolve({ok: false, error: 'ชื่อเหมือนเดิม'}) : api('pp_rename', {from: g.main, to: v.main})
  });
  else if (a === 'sub' && g) dlg({
    title: 'เพิ่มตัวรอง', msg: 'หมวก: ' + g.main, sub: true, color: true, yes: 'เพิ่ม',
    run: v => api('pp_save', {main: g.main, sub: v.sub, color: v.color})
  });
  else if (a === 'ed' && p) dlg({
    title: 'แก้ไขตัวรอง', msg: 'หมวก: ' + p.main, sub: true, color: true, subVal: p.sub, colorVal: p.color, yes: 'บันทึก',
    run: v => api('pp_save', {id: p.id, main: p.main, sub: v.sub, color: v.color})
  });
  else if (a === 'act' && p) {
    if (p.active) dlg({
      title: 'ปิดใช้งานตัวรองนี้?', msg: p.main + ' / ' + p.sub + '\nจะไม่แสดงให้เลือกตอนบันทึกใหม่ (รายการเก่าและสถิติยังอยู่ครบ เปิดกลับได้ทุกเมื่อ)',
      yes: 'ปิดใช้งาน', danger: true, run: () => api('pp_active', {id: p.id, active: false})
    });
    else act('pp_active', {id: p.id, active: true});
  }
};

load(); pendingBadge();
</script>
</body>
</html>
