<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://cmcooking.cmcooking.workers.dev; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#0f3d3e">
<meta name="referrer" content="no-referrer">

<title>CMCOOKING On Hand</title>
<style>
:root{--g:#B2D235;--o:#F58220;--bg:#07090a;--card:#0f1512;--ink:#e8f0e4;--mut:#8fa196;--line:#22302a;--soft:#16201b;--err:#ff5c5c;--glow:0 0 12px #B2D23566;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Noto Sans Thai","Sarabun",sans-serif;padding-bottom:env(safe-area-inset-bottom)}
.hide{display:none!important}
[hidden]{display:none!important}
#bar{position:fixed;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--g),transparent) no-repeat;background-size:50% 100%;animation:slide 1s linear infinite;opacity:0;transition:opacity .15s;z-index:9;pointer-events:none}
#bar.on{opacity:1}
@keyframes slide{from{background-position:-50% 0}to{background-position:150% 0}}
header{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:12px 16px;background:#060807;border-bottom:2px solid var(--g);box-shadow:0 2px 16px #B2D23540}
.mark{width:36px;height:36px;flex:none;border-radius:10px;border:1.5px solid var(--g);box-shadow:var(--glow);display:grid;place-items:center;color:var(--g);font-weight:800}
.ttl{flex:1;min-width:0}
header h1{margin:0;font-size:19px;letter-spacing:1.5px;color:var(--g);text-shadow:0 0 10px #B2D235aa}
header small{display:block;font-size:12px;color:var(--mut)}
.exit{background:transparent;color:var(--mut);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12px;box-shadow:none}
nav.nav{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;border-bottom:1px solid var(--line);background:#0a0e0c;scrollbar-width:none}
nav.nav a{flex:none;display:inline-flex;align-items:center;padding:7px 12px;border:1px solid var(--line);border-radius:10px;color:var(--mut);text-decoration:none;font-size:13px;font-weight:600}
nav.nav a.on{border-color:var(--g);color:var(--g);box-shadow:0 0 10px #B2D23540}
.badge{display:inline-block;min-width:20px;text-align:center;margin-left:6px;padding:0 6px;border-radius:10px;background:var(--o);color:#1a0b00;font-size:12px;font-weight:800;box-shadow:0 0 8px #F5822099}
main{max-width:720px;margin:auto;padding:14px 16px 90px}
.hint{color:var(--mut);font-size:13px;margin:0 0 12px}
#msg{color:var(--err);min-height:1.5em;margin:0 0 8px}
#msg.ok{color:var(--g)}
input,select{font:inherit;color:var(--ink);width:100%;padding:12px;background:#0a0f0c;border:1px solid var(--line);border-radius:10px;margin:4px 0 12px}
input:focus,select:focus{outline:2px solid var(--o);outline-offset:1px}
label{font-size:13px;color:var(--mut)}
button{font:inherit;font-weight:700;color:var(--g);background:transparent;border:1.5px solid var(--g);border-radius:12px;padding:10px 14px;cursor:pointer;box-shadow:0 0 10px #B2D23540}
button:focus-visible,a:focus-visible{outline:2px solid var(--o);outline-offset:2px}
button:disabled{opacity:.45;box-shadow:none}
button.ghost{color:var(--ink);border-color:var(--line);box-shadow:none}
button.del{color:var(--err);border-color:var(--err);box-shadow:none}
button.solid{background:var(--g);color:#071004}
button.solid.del{background:var(--err);color:#1a0303;border-color:var(--err)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));background:var(--o);color:#1a0b00;border-color:var(--o);box-shadow:0 0 18px #F58220aa;border-radius:28px;padding:14px 20px}
.empty{color:var(--mut);text-align:center;padding:32px 0}
#dlg{position:fixed;inset:0;z-index:30;background:#000c;display:flex;align-items:center;justify-content:center;padding:20px}
#dlg .box{background:var(--card);border:1px solid var(--g);box-shadow:0 0 22px #B2D23533;border-radius:16px;padding:18px;width:100%;max-width:380px;max-height:90vh;overflow:auto}
#dlg h2{font-size:18px;color:var(--g);margin:0 0 10px}
#dlg p{margin:0 0 12px;overflow-wrap:anywhere;white-space:pre-line}
#dlgE{color:var(--err);min-height:1.2em;margin:0 0 8px;font-size:14px}

.u{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--g);border-radius:12px;margin:8px 0;padding:10px 12px}
.u.off{border-left-color:var(--mut);opacity:.7}
.u b{font-size:17px;margin-right:6px;overflow-wrap:anywhere}
.tag{display:inline-block;padding:0 8px;border-radius:10px;background:var(--g);color:#071004;font-size:12px;font-weight:700;line-height:1.6;margin-right:4px}
.tag.t{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.tag.x{background:var(--err);color:#fff}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.acts button{flex:1;padding:6px 8px;font-size:13px;white-space:nowrap}
.pinrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start}
.pinrow button{margin-top:4px;padding:12px}
.pinshow{font:700 28px/1.2 ui-monospace,Menlo,Consolas,monospace;letter-spacing:3px;text-align:center;background:var(--soft);border:1px dashed var(--g);border-radius:10px;padding:12px;margin:0 0 12px;user-select:all;color:var(--g)}

/* ===== CMCS template: shared header + base ===== */
header.cx{position:sticky;top:0;z-index:20;height:calc(56px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 0 0;margin:0;
  display:flex;align-items:center;justify-content:center;gap:0;background:#B2D235;color:#1a1a1a;
  border:0;border-bottom:1px solid rgba(0,0,0,.10);box-shadow:0 2px 4px rgba(0,0,0,.06)}
header.cx .cx-title{display:flex;align-items:center;gap:8px;min-width:0}
header.cx .cx-gear{width:22px;height:22px;flex:none}
header.cx .cx-tt{display:flex;flex-direction:column;align-items:flex-start;line-height:1.1}
header.cx .cx-sub{font-size:11px;font-weight:700;letter-spacing:1.5px;color:#1a1a1a;opacity:.7;text-transform:uppercase}
header.cx .cx-sub:empty{display:none}
header.cx h1{margin:0;font-size:16px;font-weight:700;letter-spacing:1.5px;color:#1a1a1a;white-space:nowrap;text-shadow:none}
header.cx .cx-btn{position:absolute;top:calc(50% + env(safe-area-inset-top) / 2);transform:translateY(-50%);width:38px;height:38px;margin:0;padding:0;
  display:grid;place-items:center;background:transparent;color:#1a1a1a;border:1.5px solid #1a1a1a;border-radius:10px;box-shadow:none;text-decoration:none;cursor:pointer}
header.cx .cx-btn.l{left:12px} header.cx .cx-btn.r{right:12px}
header.cx .cx-btn:active{background:#000;color:#fff}
header.cx .cx-i{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#bar{background:linear-gradient(90deg,transparent,#000,transparent) no-repeat;background-size:50% 100%}
.cx-ic{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* equal menu cards (same size as the COOK / CHEF cards) */
.cx-cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:min(78vw,320px);min-width:250px;margin:0 auto}
.cx-card{position:relative;height:92px;margin:0;padding:6px;border:0;border-radius:10px;background:#fff;color:#1a1a1a;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;text-decoration:none;
  box-shadow:0 2px 6px rgba(0,0,0,.08);cursor:pointer;font:inherit;transition:background .15s,color .15s,transform .1s}
.cx-card:active{transform:scale(.97);background:#000;color:#fff}
.cx-card b{display:block;font-size:13px;font-weight:700;letter-spacing:1.2px;line-height:1.15;text-transform:uppercase}
.cx-card small{display:block;font-size:11px;font-weight:600;line-height:1.1;color:inherit;opacity:.7;margin-top:-4px}
.cx-card.alert{background:#000;color:#fff}
.cx-card.alert::after{content:"";position:absolute;top:9px;right:9px;width:9px;height:9px;border-radius:50%;background:#F58220}
.cx-who{display:flex;flex-direction:column;align-items:center;gap:4px;margin:10px 0 22px;text-align:center}
.cx-who b{font-size:17px;font-weight:600;color:#1a1a1a}

/* ===== CMCS template: admin pages ===== */
:root{--g:#1a1a1a;--o:#F58220;--bg:#B2D235;--card:#fff;--ink:#1a1a1a;--mut:#5b6152;--line:#d9dfcd;--soft:#f2f4ec;--err:#b3261e;--glow:none;color-scheme:light}
*{text-shadow:none!important}
body{background:#B2D235;color:#1a1a1a}
nav.nav{background:#B2D235;border-bottom:0;padding:12px 16px 4px;justify-content:center;flex-wrap:wrap}
nav.nav a{background:#fff;border:0;color:#1a1a1a;border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.08)}
nav.nav a.on{background:#000;color:#fff;box-shadow:none}
.badge{box-shadow:none}
main{max-width:640px;animation:cxFade .22s ease-out}
@keyframes cxFade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){main{animation:none}}
#msg.ok{color:#1a1a1a}
.hint,.empty{color:#3d4433}
input,select{background:#fff;color:#1a1a1a;border:1.5px solid #1a1a1a;border-radius:10px}
input:focus,select:focus,button:focus-visible,a:focus-visible{outline:2px solid #000;outline-offset:1px}
label{color:#3d4433}
button{background:#000;color:#fff;border:1.5px solid #000;border-radius:10px;box-shadow:none}
button.ghost{background:#fff;color:#1a1a1a;border-color:#1a1a1a}
button.del{background:#fff;color:var(--err);border-color:var(--err)}
button.solid{background:#000;color:#fff}
button.solid.del{background:var(--err);color:#fff;border-color:var(--err)}
button:disabled{opacity:.45}
.fab{background:#000;color:#fff;border-color:#000;box-shadow:0 8px 16px -8px rgba(0,0,0,.6)}
#dlg .box{background:#fff;border:0;box-shadow:0 10px 30px rgba(0,0,0,.35)}
#dlg h2{color:#1a1a1a}
.who{justify-content:center}
.tag{box-shadow:none}
.who .tag{background:#B2D235;color:#1a1a1a}
/* page cards */
.req,.g,.card,.u,.tiles .tile,.tile:not(.cx-card){border:0;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.req{border-left:5px solid var(--o)}
.u{border-left:4px solid #B2D235}
.u .tag:not(.t):not(.x){background:#B2D235;color:#1a1a1a}
.gh{background:#f2f4ec}
.sw button.on{border-color:#000}
.pinshow{color:#1a1a1a;border-color:#1a1a1a}
.days div{background:#1a1a1a}
.u .un{font-size:12px;color:var(--mut);margin-top:2px}
.acts button{flex:1 1 30%}
</style>
<style>
.oh-teams{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 12px}
.oh-team{background:#fff;border:0;border-radius:10px;padding:10px 12px;text-align:left;color:#1a1a1a;box-shadow:0 2px 6px rgba(0,0,0,.08);cursor:pointer;font:inherit}
.oh-team.on{background:#000;color:#fff}
.oh-team b{display:block;font-size:15px}
.oh-team span{display:block;font-size:12px;opacity:.75;line-height:1.35}
.oh-filter{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.oh-filter input{grid-column:1/-1}
.oh-filter select,.oh-filter input{margin:0 0 8px}
.oh-bar{display:flex;justify-content:flex-end;margin:0 0 6px}
.oh-bar button{padding:7px 12px;font-size:13px}
.dv{background:#fff;border-radius:10px;margin:8px 0;padding:10px 12px;box-shadow:0 2px 6px rgba(0,0,0,.08);border-left:4px solid #B2D235}
.dv.ins{border-left-color:#1a1a1a}
.dv.rem{border-left-color:#9aa08f;background:#eef0e8;color:#5b6152}
.dv .sn{font:700 17px/1.3 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.5px;overflow-wrap:anywhere}
.dv.rem .sn{text-decoration:line-through}
.dv .meta{font-size:12px;color:#5b6152;margin-top:2px}
.dv .why{font-size:13px;font-weight:600;color:#7a2a1a;margin-top:4px}
.dv .tag{display:inline-block;padding:0 8px;border-radius:10px;font-size:11px;font-weight:700;line-height:1.7;margin-left:6px;vertical-align:middle}
.tag.st{background:#B2D235;color:#1a1a1a}.tag.in{background:#1a1a1a;color:#fff}.tag.rm{background:#9aa08f;color:#fff}.tag.tm{background:#f2f4ec;color:#1a1a1a}.tag.ty{background:#fff;color:#1a1a1a;border:1px solid #1a1a1a}
.dv .acts{display:flex;gap:6px;margin-top:8px}.dv .acts button,.dv .acts a{flex:1;padding:6px 8px;font-size:13px}
.dv a.job{display:flex;align-items:center;justify-content:center;border-radius:10px;background:#000;color:#fff;text-decoration:none;font-weight:700}
#ohSns{width:100%;min-height:150px;font:600 15px/1.5 ui-monospace,Menlo,Consolas,monospace;padding:10px;border:1.5px solid #1a1a1a;border-radius:10px;margin:4px 0 4px;resize:vertical}
#ohCount{font-size:12px;color:#5b6152;margin:0 0 12px}
.ty-row{display:flex;align-items:center;gap:6px;padding:8px 0;border-top:1px solid #e1e5d8}
.ty-row b{flex:1;font-size:15px}.ty-row small{color:#5b6152;font-size:12px;margin-left:4px}
.ty-row.off b{opacity:.5;text-decoration:line-through}
.ty-row button{padding:5px 10px;font-size:12px}
.ty-add{display:flex;gap:6px;margin-top:10px}.ty-add input{margin:0}.ty-add button{flex:none;padding:0 14px}

/* ===== CMCS minimal: one standard for every page ===== */
body{font-size:15px;line-height:1.45}
button{min-height:36px;padding:0 12px;font-size:13px;font-weight:600;border-radius:8px;gap:6px;letter-spacing:0;line-height:1.2;display:inline-flex;align-items:center;justify-content:center}
button .ic,.mi{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
button.ghost{background:#fff;color:#1a1a1a;border:1px solid rgba(0,0,0,.2)}
button.del{background:#fff;color:var(--err);border:1px solid rgba(155,0,24,.4)}
button.solid.del{background:var(--err);color:#fff;border-color:var(--err)}
input,select,textarea{font-size:15px;padding:9px 11px;border:1px solid rgba(0,0,0,.3);border-radius:8px;margin:3px 0 12px}
label{font-size:12px;font-weight:600}
.fab{min-height:44px;padding:0 18px;border-radius:22px;font-size:14px;gap:6px}
.tag{font-size:11px;padding:0 7px;line-height:1.6}
#dlg .box{border-radius:14px;padding:18px}
#dlg button{min-height:40px;font-size:14px}

main{padding:12px 12px 90px}
nav.nav{flex-wrap:wrap;justify-content:center;gap:4px;padding:10px 8px 2px}
nav.nav a{padding:4px 7px;font-size:11.5px;border-radius:8px}
.oh-team{display:block;min-height:0;padding:10px 12px;text-align:left;font-weight:400}
.s{flex-wrap:nowrap;gap:5px;padding:7px 10px}
.sn{min-width:0;font-size:14px}
.acts{gap:4px}
.acts button,.acts a{padding:0 8px}
.u .acts{display:grid;grid-template-columns:repeat(5,1fr)}
.u .acts button{padding:0 4px}
.hint{font-size:12px}
.u,.req,.g,.dv{border-radius:10px}
.u{padding:10px 12px}
.u b{font-size:15px}
.u .un{font-size:11px}
.acts{gap:6px;margin-top:8px;flex-wrap:wrap}
.acts button,.acts a{flex:0 0 auto;min-height:30px;padding:0 10px;font-size:12px}
button.sm{min-height:30px;padding:0 10px;font-size:12px}
button.mv{min-height:30px;width:30px;padding:0;font-size:11px}
.fab .mi{width:18px;height:18px}

.dv .acts a.bcl{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:30px;padding:0 10px;border:1px solid rgba(0,0,0,.2);border-radius:8px;background:#fff;color:#1a1a1a;text-decoration:none;font-size:12px;font-weight:600;flex:0 0 auto}

/* brand: CMCOOKING + role */
header.cx h1,#vLogin .lg-head h1{font-weight:800;letter-spacing:2px;display:flex;align-items:center;gap:7px}
header.cx h1{font-size:18px}
.cx-role{font-size:10px;font-weight:800;letter-spacing:1px;background:#000;color:#fff;border-radius:6px;padding:2px 6px;line-height:1.35}
.cx-role:empty{display:none}
header.cx{--hatbg:#B2D235}
header.cx .cx-gear.cx-roleic{width:28px;height:28px;color:#1a1a1a}
.cx-role{display:inline-flex;align-items:center;gap:3px}
.cx-bi{width:11px;height:11px;flex:none}
.cx-fly{position:fixed;z-index:200;pointer-events:none;color:#1a1a1a;--hatbg:#B2D235}
#vLogin .lg-card{--hatbg:#fff}
#vLogin .lg-card[aria-pressed="true"]{--hatbg:#000}
#vLogin .lg-card .lg-ic{width:46px;height:46px;stroke:none;color:#1a1a1a}
#vLogin .lg-card[aria-pressed="true"] .lg-ic{color:#fff;stroke:none}

.cx-foot{text-align:center;font-size:11px;color:rgba(0,0,0,.55);letter-spacing:.3px;padding:18px 12px calc(84px + env(safe-area-inset-bottom))}
.cx-foot b{font-weight:800;color:rgba(0,0,0,.7);letter-spacing:1px}
#vLogin .cx-foot{flex:none;padding:10px 12px calc(14px + env(safe-area-inset-bottom))}
</style>
</head>

    <h2 id="dlgT"></h2>
    <p id="dlgM"></p>
    <div id="fTeam"><label for="tm">ทีม (Name)</label><input id="tm" maxlength="30" list="teamList" autocomplete="off"><datalist id="teamList"></datalist></div>
    <div id="fTypeSel"><label for="ty">Type อุปกรณ์</label><select id="ty"></select></div>
    <div id="fSns"><label for="ohSns">SN (บรรทัดละ 1 SN · วางหลายบรรทัดได้)</label><textarea id="ohSns" autocapitalize="characters" spellcheck="false"></textarea><p id="ohCount"></p></div>
    <div id="fReason"><label for="rs">เหตุผลที่ลบ</label><select id="rs"></select><div id="fNote"><label for="rn">ระบุเหตุผล</label><input id="rn" maxlength="100" autocomplete="off"></div></div>
    <div id="fTypes"><div id="tyList"></div><div class="ty-add"><input id="tyNew" maxlength="30" placeholder="ชื่อ Type ใหม่ เช่น AX3000" autocomplete="off" autocapitalize="characters"><button id="tyAdd" type="button">เพิ่ม</button></div></div>
    <p id="dlgE" role="alert"></p>
    <div class="two"><button id="dlgNo" class="ghost">ยกเลิก</button><button id="dlgYes">ตกลง</button></div>
  </div>
</div>

<script>
if (window.top !== window.self) { document.documentElement.textContent = ''; throw new Error('framed'); }   // กันถูกฝังในเว็บอื่น (clickjacking)
const API = 'https://cmcooking.cmcooking.workers.dev/';   // Worker API
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let token = null, me = null, pending = 0;   // อ่านจาก sessionStorage ของแท็บนี้ (ใช้ร่วมกับหน้าเข้าสู่ระบบ)
try { token = sessionStorage.getItem('t'); me = JSON.parse(sessionStorage.getItem('u') || 'null'); } catch (e) { token = null; me = null; }
if (!token || !me || me.role !== 'admin' || me.mustChange) { location.replace('index.html'); throw new Error('no-session'); }   // ต้องเข้าผ่านหน้าเข้าสู่ระบบก่อน
function say(t, ok){ $('msg').textContent = t || ''; $('msg').className = ok ? 'ok' : ''; }
function bye(){ if (token) fetch(API, {method:'POST', body: JSON.stringify({action:'logout', token})}).catch(() => {}); }   // ยกเลิกเซสชันฝั่งเซิร์ฟเวอร์
function endSession(m){ bye(); token = null; me = null; try { sessionStorage.clear(); if (m) sessionStorage.setItem('flash', m); } catch (e) {} location.replace('index.html'); }
$('out').onclick = () => endSession('');
function badge(n){ const b = $('apBadge'); if (b) { b.textContent = n; b.classList.toggle('hide', !n); } }
(function markNav(){ const here = location.pathname.split('/').pop() || 'admin.html'; document.querySelectorAll('nav.nav a').forEach(a => a.classList.toggle('on', a.getAttribute('href') === here)); })();
async function api(action, data = {}){
  pending++; $('bar').classList.add('on');
  try{
    const r = await fetch(API, {method:'POST', body: JSON.stringify({action, token, ...data})});
    const j = await r.json();
    if (j.auth) endSession(j.error);
    return j;
  }catch(e){ return {ok:false, error:'เชื่อมต่อไม่ได้ ตรวจสอบสัญญาณแล้วลองใหม่'}; }
  finally{ if (--pending <= 0) { pending = 0; $('bar').classList.remove('on'); } }
}
async function busy(b, txt, fn){
  const old = b.textContent; b.disabled = true; b.textContent = txt;
  try{ return await fn(); } finally { b.disabled = false; b.textContent = old; }
}
function pendingBadge(){ api('req_list').then(j => { if (j.ok) badge(j.items.length); }); }
let data = {devices: [], teams: [], types: [], reasons: [], userTeams: []}, timer = null;
try { const h = new URLSearchParams(location.hash.slice(1)); if (h.get('q')) $('fQ').value = h.get('q'); } catch (e) {}
async function load(){
  const j = await api('oh_list', {team: $('fTeamSel').value, type: $('fType').value, status: $('fStatus').value, q: $('fQ').value.trim()});
  if (!j.ok) { $('list').innerHTML = ''; return say(j.error); }
  data = j; draw();
}
function allTeams(){ return [...new Set([...(data.userTeams || []), ...data.teams.map(t => t.team)])].sort(); }
function opts(sel, first, list, keep){ sel.innerHTML = (first ? `<option value="">${first}</option>` : '') + list.map(([v, t]) => `<option value="${esc(v)}">${esc(t)}</option>`).join(''); sel.value = keep; if (sel.value !== keep) sel.value = ''; }
function draw(){
  const tot = data.teams.reduce((a, t) => a + t.stock, 0), ins = data.teams.reduce((a, t) => a + t.installed, 0), rem = data.teams.reduce((a, t) => a + t.removed, 0);
  $('cap').textContent = 'ในคลัง ' + tot + ' · ติดตั้งแล้ว ' + ins + ' · ลบแล้ว ' + rem + ' เครื่อง';
  const cur = $('fTeamSel').value;
  $('teams').innerHTML = data.teams.map(t => `<button type="button" class="oh-team ${t.team === cur ? 'on' : ''}" data-team="${esc(t.team)}"><b>${esc(t.team)}</b><span>ในคลัง ${t.stock} · ติดตั้ง ${t.installed}</span><span>${t.types.map(x => esc(x.type) + ' ' + x.stock).join(' · ') || '-'}</span></button>`).join('');
  opts($('fTeamSel'), 'ทุกทีม', allTeams().map(t => [t, t]), $('fTeamSel').value);
  opts($('fType'), 'ทุก Type', data.types.map(t => [t.id, t.name + (t.active ? '' : ' (ปิด)')]), $('fType').value);
  $('list').innerHTML = data.devices.length ? data.devices.map((d, i) => {
    const st = {stock: ['st', 'ในคลัง', ''], installed: ['in', 'ติดตั้งแล้ว', 'ins'], removed: ['rm', 'ลบแล้ว', 'rem']}[d.status];
    const meta = d.status === 'stock' ? 'รับเข้า ' + esc(d.at) + ' · ' + esc(d.by)
      : d.status === 'installed' ? 'ติดตั้ง ' + esc(d.instAt) + ' · ' + esc(d.instBy) + (d.net ? ' · ' + esc(d.net) : '')
      : 'ลบ ' + esc(d.remAt) + ' · ' + esc(d.remBy);
    const acts = d.status === 'stock' ? '<button class="ghost" data-a="move"><svg class="mi" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>ย้ายทีม</button><button class="del" data-a="del"><svg class="mi" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>ลบ</button>'
      : d.status === 'installed' && d.cid ? `<a class="job" href="index.html#sn=${encodeURIComponent(d.sn)}&job=${encodeURIComponent(d.cid)}">เปิดงาน ${esc(d.net)} →</a>`
      : d.status === 'removed' ? '<button class="ghost" data-a="restore"><svg class="mi" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5M4 9h11a5 5 0 0 1 0 10h-3"/></svg>กู้คืน</button>' : '';
    return `<div class="dv ${st[2]}" data-i="${i}">
      <div><span class="sn">${esc(d.sn)}</span><span class="tag ${st[0]}">${st[1]}</span><span class="tag ty">${esc(d.type || '-')}</span><span class="tag tm">${esc(d.team)}</span></div>
      <div class="meta">${meta}</div>
      ${d.status === 'removed' ? `<div class="why">เหตุผล: ${esc(d.reason)}${d.note ? ' · ' + esc(d.note) : ''}</div>` : ''}
      <div class="acts"><a class="bcl" href="index.html#bar=${encodeURIComponent(d.sn)}"><svg class="mi" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5v14M7.5 5v14M11 5v14M15 5v14M18.5 5v14M21 5v14"/></svg>Barcode</a>${acts}</div>
    </div>`;
  }).join('') : '<p class="empty">ไม่มีรายการ</p>';
}
$('teams').onclick = e => { const b = e.target.closest('[data-team]'); if (!b) return; $('fTeamSel').value = $('fTeamSel').value === b.dataset.team ? '' : b.dataset.team; load(); };
$('fTeamSel').onchange = load; $('fStatus').onchange = load; $('fType').onchange = load;
$('fQ').oninput = () => { clearTimeout(timer); timer = setTimeout(load, 350); };

/* ---------- dialog ---------- */
let dlgSubmit = null;
const FIELDS = ['fTeam', 'fTypeSel', 'fSns', 'fReason', 'fTypes'];
const snLines = () => $('ohSns').value.split(/[\r\n,]+/).map(s => s.trim()).filter(Boolean);
$('ohSns').oninput = () => { const n = new Set(snLines().map(s => s.toLowerCase())).size; $('ohCount').textContent = n ? n + ' SN' : ''; };
$('rs').onchange = () => $('fNote').classList.toggle('hide', $('rs').value !== 'อื่นๆ');
function closeDlg(){ $('dlg').classList.add('hide'); dlgSubmit = null; }
function dlg(cfg){
  $('dlgT').textContent = cfg.title; $('dlgM').textContent = cfg.msg || ''; $('dlgM').classList.toggle('hide', !cfg.msg);
  FIELDS.forEach(x => $(x).classList.toggle('hide', !cfg[x]));
  $('teamList').innerHTML = allTeams().map(t => `<option value="${esc(t)}">`).join('');
  $('ty').innerHTML = '<option value="">— เลือก Type —</option>' + data.types.filter(t => t.active).map(t => `<option value="${esc(t.id)}">${esc(t.name)}</option>`).join('');
  $('rs').innerHTML = '<option value="">— เลือกเหตุผล —</option>' + data.reasons.map(r => `<option>${esc(r)}</option>`).join(''); $('fNote').classList.add('hide');
  $('tm').value = cfg.teamVal || ''; $('ty').value = cfg.typeVal || ''; $('ohSns').value = ''; $('ohCount').textContent = ''; $('rn').value = ''; $('dlgE').textContent = '';
  const y = $('dlgYes'); y.textContent = cfg.yes; y.className = cfg.danger ? 'del solid' : ''; y.disabled = false; y.classList.toggle('hide', !!cfg.noYes);
  $('dlgNo').textContent = cfg.noYes ? 'ปิด' : 'ยกเลิก'; $('dlgNo').classList.remove('hide');
  $('dlg').classList.remove('hide');
  if (cfg.fTypes) drawTypes();
  (cfg.fTeam ? $('tm') : cfg.fReason ? $('rs') : cfg.fTypes ? $('tyNew') : y).focus();
  dlgSubmit = async () => {
    $('dlgE').textContent = ''; y.disabled = true;
    const j = await cfg.run();
    y.disabled = false;
    if (!j.ok) { $('dlgE').textContent = j.error || 'ไม่สำเร็จ'; return; }
    if (cfg.after) cfg.after(j); else closeDlg();
    load();
  };
}
$('dlgYes').onclick = () => dlgSubmit && dlgSubmit();
$('dlgNo').onclick = () => { closeDlg(); load(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('dlg').classList.contains('hide')) closeDlg(); });

/* Type: เพิ่ม / เปลี่ยนชื่อ / เปิด-ปิด */
function drawTypes(){
  $('tyList').innerHTML = data.types.length ? data.types.map(t => `<div class="ty-row ${t.active ? '' : 'off'}" data-id="${esc(t.id)}"><b>${esc(t.name)}<small>${t.n} เครื่อง</small></b>
    <button class="ghost" data-t="ren">แก้ชื่อ</button><button class="${t.active ? 'del' : 'ghost'}" data-t="act">${t.active ? 'ปิด' : 'เปิด'}</button></div>`).join('') : '<p class="hint">ยังไม่มี Type เพิ่มด้านล่าง</p>';
}
async function typeCall(action, d){ $('dlgE').textContent = ''; const j = await api(action, d); if (!j.ok) { $('dlgE').textContent = j.error; return; } data.types = j.types; drawTypes(); }
$('tyAdd').onclick = async () => { const n = $('tyNew').value.trim(); if (!n) return; await typeCall('dt_save', {name: n}); if (!$('dlgE').textContent) $('tyNew').value = ''; };
$('tyNew').addEventListener('keydown', e => { if (e.key === 'Enter') $('tyAdd').click(); });
$('tyList').onclick = async e => {
  const b = e.target.closest('[data-t]'); if (!b) return;
  const t = data.types.find(x => x.id === b.closest('.ty-row').dataset.id); if (!t) return;
  if (b.dataset.t === 'act') return typeCall('dt_active', {id: t.id, active: !t.active});
  const row = b.closest('.ty-row');
  row.innerHTML = `<input value="${esc(t.name)}" maxlength="30" style="margin:0;flex:1"><button data-t="ok">บันทึก</button>`;
  const inp = row.querySelector('input'); inp.focus();
  row.querySelector('[data-t=ok]').onclick = ev => { ev.stopPropagation(); typeCall('dt_save', {id: t.id, name: inp.value.trim()}); };
};
$('types').onclick = () => dlg({title: 'Type อุปกรณ์', msg: 'Type ที่ปิดแล้วเลือกตอนรับเข้าไม่ได้ แต่เครื่องเดิมยังแสดง Type นั้น', fTypes: true, noYes: true, yes: ''});

$('add').onclick = () => {
  if (!data.types.some(t => t.active)) return dlg({title: 'ยังไม่มี Type', msg: 'เพิ่ม Type อุปกรณ์ก่อนรับเข้าคลัง', fTypes: true, noYes: true, yes: ''});
  dlg({
    title: 'รับเข้าคลัง', fTeam: true, fTypeSel: true, fSns: true, teamVal: $('fTeamSel').value, typeVal: $('fType').value, yes: 'รับเข้า',
    run: () => api('oh_add', {team: $('tm').value.trim(), typeId: $('ty').value, sns: snLines()}),
    after: j => {
      $('dlgT').textContent = 'รับเข้าแล้ว ' + j.added.length + ' SN';
      const rem = j.dup.filter(x => x.status === 'removed');
      $('dlgM').textContent = j.dup.length ? 'มีอยู่แล้ว (ข้าม) ' + j.dup.length + ' SN:\n' + j.dup.map(x => x.sn + ' · ' + x.team + ' · ' + ({stock: 'ในคลัง', installed: 'ติดตั้งแล้ว', removed: 'ลบแล้ว'}[x.status] || '')).join('\n') + (rem.length ? '\n\nSN ที่ "ลบแล้ว" ให้กด กู้คืนเข้าคลัง ในรายการ' : '') : 'ไม่มี SN ซ้ำ';
      $('dlgM').classList.remove('hide'); FIELDS.forEach(x => $(x).classList.add('hide'));
      $('dlgNo').classList.add('hide'); $('dlgYes').textContent = 'ปิด'; dlgSubmit = () => closeDlg();
    }
  });
};
$('list').onclick = e => {
  const b = e.target.closest('button[data-a]'); if (!b) return;
  const d = data.devices[+b.closest('.dv').dataset.i]; if (!d) return;
  if (b.dataset.a === 'move') dlg({
    title: 'ย้ายทีม', msg: 'SN: ' + d.sn + ' (' + d.type + ')\nทีมปัจจุบัน: ' + d.team, fTeam: true, yes: 'ย้าย',
    run: () => api('oh_move', {sn: d.sn, team: $('tm').value.trim()})
  });
  if (b.dataset.a === 'del') dlg({
    title: 'ลบออกจากคลัง', msg: 'SN: ' + d.sn + ' (' + d.type + ' · ' + d.team + ')\nเครื่องจะยังอยู่ในรายการ สถานะ "ลบแล้ว" และกู้คืนได้', fReason: true, yes: 'ลบ', danger: true,
    run: () => api('oh_remove', {sn: d.sn, reason: $('rs').value, note: $('rn').value.trim()})
  });
  if (b.dataset.a === 'restore') dlg({
    title: 'กู้คืนเข้าคลัง?', msg: 'SN: ' + d.sn + ' (' + d.type + ')\nกลับเข้าคลังทีม ' + d.team + '\nเหตุผลที่ลบเดิม: ' + d.reason + (d.note ? ' · ' + d.note : ''), yes: 'กู้คืน',
    run: () => api('oh_restore', {sn: d.sn})
  });
};

load(); pendingBadge();

/* ไอคอนบทบาท + ป้าย CHEF / COOK บนหัวเว็บ */
const ROLE_IC = {"cook": "<g fill=\"none\" stroke=\"#9aa3ad\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6.5 31.5 L27 11\"/><path d=\"M27.5 10.5 m-1.6-4.3 a4 4 0 0 1 5.9 5.9 l-2.6-.5 -.7-2.6 z\"/><path d=\"M29.5 31.5 L10 12\"/></g><rect x=\"3.6\" y=\"5.2\" width=\"8.2\" height=\"5.4\" rx=\"1.3\" fill=\"#9aa3ad\" transform=\"rotate(45 7.7 7.9)\"/><g transform=\"translate(0 2)\"><path style=\"fill:var(--hatbg,#fff)\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linejoin=\"round\" d=\"M10.5 18.5 a5.2 5.2 0 0 1 1.8-10 a6.2 6.2 0 0 1 11.4 0 a5.2 5.2 0 0 1 1.8 10 z\"/><path style=\"fill:var(--hatbg,#fff)\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linejoin=\"round\" d=\"M10.5 18.5 h15 v5.5 h-15 z\"/><path stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" d=\"M15 20.8 v1 M18 20.8 v1 M21 20.8 v1\"/></g>", "chef": "<g transform=\"translate(0 -1)\"><path style=\"fill:var(--hatbg,#fff)\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linejoin=\"round\" d=\"M10.5 18.5 a5.2 5.2 0 0 1 1.8-10 a6.2 6.2 0 0 1 11.4 0 a5.2 5.2 0 0 1 1.8 10 z\"/><path style=\"fill:var(--hatbg,#fff)\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linejoin=\"round\" d=\"M10.5 18.5 h15 v5.5 h-15 z\"/><path stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" d=\"M15 20.8 v1 M18 20.8 v1 M21 20.8 v1\"/></g><path d=\"M18.00 23.70 L19.53 27.39 L23.52 27.71 L20.48 30.31 L21.41 34.19 L18.00 32.11 L14.59 34.19 L15.52 30.31 L12.48 27.71 L16.47 27.39Z\" fill=\"#F5B700\" stroke=\"#B98200\" stroke-width=\".9\" stroke-linejoin=\"round\"/>"}, ROLE_BADGE = {"chef": "<svg class=\"cx-bi\" viewBox=\"0 0 12 12\" aria-hidden=\"true\"><path d=\"M6.00 0.80 L7.48 4.36 L11.33 4.67 L8.40 7.18 L9.29 10.93 L6.00 8.92 L2.71 10.93 L3.60 7.18 L0.67 4.67 L4.52 4.36Z\" fill=\"#F5B700\" stroke=\"#B98200\" stroke-width=\".5\"/></svg>", "cook": "<svg class=\"cx-bi\" viewBox=\"0 0 12 12\" aria-hidden=\"true\"><g stroke=\"#c4cad1\" stroke-width=\"1.6\" stroke-linecap=\"round\" fill=\"none\"><path d=\"M2 10 L9 3\"/><path d=\"M10 10 L3 3\"/><path d=\"M9.2 1.6 a1.6 1.6 0 1 1 1.2 1.2\"/></g><rect x=\"1.2\" y=\"1.3\" width=\"3\" height=\"2\" rx=\".5\" fill=\"#c4cad1\" transform=\"rotate(45 2.7 2.3)\"/></svg>"};
function cxBrand(u){
  const role = u ? (u.role === 'admin' ? 'chef' : 'cook') : '';
  document.querySelectorAll('header.cx .cx-role').forEach(el => { el.innerHTML = role ? role.toUpperCase() + ROLE_BADGE[role] : ''; });
  document.querySelectorAll('header.cx .cx-gear').forEach(g => {
    if (!g.dataset.gear) { g.dataset.gear = g.innerHTML; g.dataset.vb = g.getAttribute('viewBox'); }
    if (role) { g.setAttribute('viewBox', '0 0 36 36'); g.innerHTML = ROLE_IC[role]; g.classList.add('cx-roleic'); }
    else { g.setAttribute('viewBox', g.dataset.vb); g.innerHTML = g.dataset.gear; g.classList.remove('cx-roleic'); }
  });
}
cxBrand(typeof me !== "undefined" ? me : null);
</script>
<footer class="cx-foot" aria-label="เวอร์ชัน"><b>CMCOOKING</b> · live v1.0</footer>
</body>
</html>
