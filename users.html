<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://cmcooking.cmcooking.workers.dev; base-uri 'none'; form-action 'none'">

<title>CMCOOKING Users</title>
<style>
:root{--g:#B2D235;--o:#F58220;--bg:#07090a;--card:#0f1512;--ink:#e8f0e4;--mut:#8fa196;--line:#22302a;--soft:#16201b;--err:#ff5c5c;--glow:0 0 12px #B2D23566;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Noto Sans Thai","Sarabun",sans-serif;padding-bottom:env(safe-area-inset-bottom)}
.hide{display:none!important}
[hidden]{display:none!important}
#bar{position:fixed;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--g),transparent) no-repeat;background-size:50% 100%;animation:slide 1s linear infinite;opacity:0;transition:opacity .15s;z-index:9;pointer-events:none}
#bar.on{opacity:1}
@keyframes slide{from{background-position:-50% 0}to{background-position:150% 0}}
header{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:12px 16px;background:#060807;border-bottom:2px solid var(--g);box-shadow:0 2px 16px #B2D23540}
.mark{width:36px;height:36px;flex:none;border-radius:10px;border:1.5px solid var(--g);box-shadow:var(--glow);display:grid;place-items:center;color:var(--g);font-weight:800}
.ttl{flex:1;min-width:0}
header h1{margin:0;font-size:19px;letter-spacing:1.5px;color:var(--g);text-shadow:0 0 10px #B2D235aa}
header small{display:block;font-size:12px;color:var(--mut)}
.exit{background:transparent;color:var(--mut);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12px;box-shadow:none}
nav.nav{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;border-bottom:1px solid var(--line);background:#0a0e0c;scrollbar-width:none}
nav.nav a{flex:none;display:inline-flex;align-items:center;padding:7px 12px;border:1px solid var(--line);border-radius:10px;color:var(--mut);text-decoration:none;font-size:13px;font-weight:600}
nav.nav a.on{border-color:var(--g);color:var(--g);box-shadow:0 0 10px #B2D23540}
.badge{display:inline-block;min-width:20px;text-align:center;margin-left:6px;padding:0 6px;border-radius:10px;background:var(--o);color:#1a0b00;font-size:12px;font-weight:800;box-shadow:0 0 8px #F5822099}
main{max-width:720px;margin:auto;padding:14px 16px 90px}
.hint{color:var(--mut);font-size:13px;margin:0 0 12px}
#msg{color:var(--err);min-height:1.5em;margin:0 0 8px}
#msg.ok{color:var(--g)}
input,select{font:inherit;color:var(--ink);width:100%;padding:12px;background:#0a0f0c;border:1px solid var(--line);border-radius:10px;margin:4px 0 12px}
input:focus,select:focus{outline:2px solid var(--o);outline-offset:1px}
label{font-size:13px;color:var(--mut)}
button{font:inherit;font-weight:700;color:var(--g);background:transparent;border:1.5px solid var(--g);border-radius:12px;padding:10px 14px;cursor:pointer;box-shadow:0 0 10px #B2D23540}
button:focus-visible,a:focus-visible{outline:2px solid var(--o);outline-offset:2px}
button:disabled{opacity:.45;box-shadow:none}
button.ghost{color:var(--ink);border-color:var(--line);box-shadow:none}
button.del{color:var(--err);border-color:var(--err);box-shadow:none}
button.solid{background:var(--g);color:#071004}
button.solid.del{background:var(--err);color:#1a0303;border-color:var(--err)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));background:var(--o);color:#1a0b00;border-color:var(--o);box-shadow:0 0 18px #F58220aa;border-radius:28px;padding:14px 20px}
.empty{color:var(--mut);text-align:center;padding:32px 0}
#dlg{position:fixed;inset:0;z-index:30;background:#000c;display:flex;align-items:center;justify-content:center;padding:20px}
#dlg .box{background:var(--card);border:1px solid var(--g);box-shadow:0 0 22px #B2D23533;border-radius:16px;padding:18px;width:100%;max-width:380px;max-height:90vh;overflow:auto}
#dlg h2{font-size:18px;color:var(--g);margin:0 0 10px}
#dlg p{margin:0 0 12px;overflow-wrap:anywhere;white-space:pre-line}
#dlgE{color:var(--err);min-height:1.2em;margin:0 0 8px;font-size:14px}

.u{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--g);border-radius:12px;margin:8px 0;padding:10px 12px}
.u.off{border-left-color:var(--mut);opacity:.7}
.u b{font-size:17px;margin-right:6px;overflow-wrap:anywhere}
.tag{display:inline-block;padding:0 8px;border-radius:10px;background:var(--g);color:#071004;font-size:12px;font-weight:700;line-height:1.6;margin-right:4px}
.tag.t{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.tag.x{background:var(--err);color:#fff}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.acts button{flex:1;padding:6px 8px;font-size:13px;white-space:nowrap}
.pinrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start}
.pinrow button{margin-top:4px;padding:12px}
.pinshow{font:700 28px/1.2 ui-monospace,Menlo,Consolas,monospace;letter-spacing:3px;text-align:center;background:var(--soft);border:1px dashed var(--g);border-radius:10px;padding:12px;margin:0 0 12px;user-select:all;color:var(--g)}

/* ===== CMCS template: shared header + base ===== */
header.cx{position:sticky;top:0;z-index:20;height:calc(56px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 0 0;margin:0;
  display:flex;align-items:center;justify-content:center;gap:0;background:#B2D235;color:#1a1a1a;
  border:0;border-bottom:1px solid rgba(0,0,0,.10);box-shadow:0 2px 4px rgba(0,0,0,.06)}
header.cx .cx-title{display:flex;align-items:center;gap:8px;min-width:0}
header.cx .cx-gear{width:22px;height:22px;flex:none}
header.cx .cx-tt{display:flex;flex-direction:column;align-items:flex-start;line-height:1.1}
header.cx .cx-sub{font-size:11px;font-weight:700;letter-spacing:1.5px;color:#1a1a1a;opacity:.7;text-transform:uppercase}
header.cx .cx-sub:empty{display:none}
header.cx h1{margin:0;font-size:16px;font-weight:700;letter-spacing:1.5px;color:#1a1a1a;white-space:nowrap;text-shadow:none}
header.cx .cx-btn{position:absolute;top:calc(50% + env(safe-area-inset-top) / 2);transform:translateY(-50%);width:38px;height:38px;margin:0;padding:0;
  display:grid;place-items:center;background:transparent;color:#1a1a1a;border:1.5px solid #1a1a1a;border-radius:10px;box-shadow:none;text-decoration:none;cursor:pointer}
header.cx .cx-btn.l{left:12px} header.cx .cx-btn.r{right:12px}
header.cx .cx-btn:active{background:#000;color:#fff}
header.cx .cx-i{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#bar{background:linear-gradient(90deg,transparent,#000,transparent) no-repeat;background-size:50% 100%}
.cx-ic{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* equal menu cards (same size as the COOK / CHEF cards) */
.cx-cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:min(78vw,320px);min-width:250px;margin:0 auto}
.cx-card{position:relative;height:92px;margin:0;padding:6px;border:0;border-radius:10px;background:#fff;color:#1a1a1a;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;text-decoration:none;
  box-shadow:0 2px 6px rgba(0,0,0,.08);cursor:pointer;font:inherit;transition:background .15s,color .15s,transform .1s}
.cx-card:active{transform:scale(.97);background:#000;color:#fff}
.cx-card b{display:block;font-size:13px;font-weight:700;letter-spacing:1.2px;line-height:1.15;text-transform:uppercase}
.cx-card small{display:block;font-size:11px;font-weight:600;line-height:1.1;color:inherit;opacity:.7;margin-top:-4px}
.cx-card.alert{background:#000;color:#fff}
.cx-card.alert::after{content:"";position:absolute;top:9px;right:9px;width:9px;height:9px;border-radius:50%;background:#F58220}
.cx-who{display:flex;flex-direction:column;align-items:center;gap:4px;margin:10px 0 22px;text-align:center}
.cx-who b{font-size:17px;font-weight:600;color:#1a1a1a}

:root{--g:#1a1a1a;--o:#F58220;--bg:#B2D235;--card:#fff;--ink:#1a1a1a;--mut:#5b6152;--line:#d9dfcd;--soft:#f2f4ec;--err:#b3261e;--glow:none;color-scheme:light}

/* brand: CMCOOKING + role */
header.cx h1,#vLogin .lg-head h1{font-weight:800;letter-spacing:2px;display:flex;align-items:center;gap:7px}
header.cx h1{font-size:18px}

<header class="cx"><a class="cx-btn l" href="admin.html" aria-label="HOME" title="HOME"><svg class="cx-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8M5 9.5V20h5v-6h4v6h5V9.5"/></svg></a><div class="cx-title"><svg class="cx-gear" viewBox="6 6 36 36" fill="none" stroke="#000" stroke-width="2.6" stroke-linejoin="round" aria-hidden="true"><path d="M24.00 11.00 L26.00 7.12 L29.88 8.05 L29.90 12.42 L33.19 14.81 L37.35 13.48 L39.44 16.88 L36.36 19.98 L37.00 24.00 L40.88 26.00 L39.95 29.88 L35.58 29.90 L33.19 33.19 L34.52 37.35 L31.12 39.44 L28.02 36.36 L24.00 37.00 L22.00 40.88 L18.12 39.95 L18.10 35.58 L14.81 33.19 L10.65 34.52 L8.56 31.12 L11.64 28.02 L11.00 24.00 L7.12 22.00 L8.05 18.12 L12.42 18.10 L14.81 14.81 L13.48 10.65 L16.88 8.56 L19.98 11.64 Z"/><circle cx="24" cy="24" r="5"/></svg><div class="cx-tt"><h1>CMCOOKING<span class="cx-role"></span></h1><small class="cx-sub" id="cxSub">Users</small></div></div><button id="out" class="cx-btn r" type="button" aria-label="EXIT" title="EXIT"><svg class="cx-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></button></header>

<script>
if (window.top !== window.self) { document.documentElement.textContent = ''; throw new Error('framed'); }   // กันถูกฝังในเว็บอื่น (clickjacking)
const API = 'https://cmcooking.cmcooking.workers.dev/';   // Worker API
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let token = null, me = null, pending = 0;   // อ่านจาก sessionStorage ของแท็บนี้ (ใช้ร่วมกับหน้าเข้าสู่ระบบ)
try { token = sessionStorage.getItem('t'); me = JSON.parse(sessionStorage.getItem('u') || 'null'); } catch (e) { token = null; me = null; }
if (!token || !me || me.role !== 'admin' || me.mustChange) { location.replace('index.html'); throw new Error('no-session'); }   // ต้องเข้าผ่านหน้าเข้าสู่ระบบก่อน
function say(t, ok){ $('msg').textContent = t || ''; $('msg').className = ok ? 'ok' : ''; }
function bye(){ if (token) fetch(API, {method:'POST', body: JSON.stringify({action:'logout', token})}).catch(() => {}); }   // ยกเลิกเซสชันฝั่งเซิร์ฟเวอร์
function endSession(m){ bye(); token = null; me = null; try { sessionStorage.clear(); if (m) sessionStorage.setItem('flash', m); } catch (e) {} location.replace('index.html'); }
$('out').onclick = () => endSession('');
function badge(n){ const b = $('apBadge'); if (b) { b.textContent = n; b.classList.toggle('hide', !n); } }
(function markNav(){ const here = location.pathname.split('/').pop() || 'admin.html'; document.querySelectorAll('nav.nav a').forEach(a => a.classList.toggle('on', a.getAttribute('href') === here)); })();
async function api(action, data = {}){
  pending++; $('bar').classList.add('on');
  try{
    const r = await fetch(API, {method:'POST', body: JSON.stringify({action, token, ...data})});
    const j = await r.json();
    if (j.auth) endSession(j.error);
    return j;
  }catch(e){ return {ok:false, error:'เชื่อมต่อไม่ได้ ตรวจสอบสัญญาณแล้วลองใหม่'}; }
  finally{ if (--pending <= 0) { pending = 0; $('bar').classList.remove('on'); } }
}
async function busy(b, txt, fn){
  const old = b.textContent; b.disabled = true; b.textContent = txt;
  try{ return await fn(); } finally { b.disabled = false; b.textContent = old; }
}
function pendingBadge(){ api('req_list').then(j => { if (j.ok) badge(j.items.length); }); }
let users = [];

async function load(){
  $('list').innerHTML = '<p class="empty">กำลังโหลด…</p>';
  const j = await api('users');
  if (!j.ok) { $('list').innerHTML = ''; return say(j.error); }
  users = j.users; draw();
}

function draw(){
  const on = users.filter(u => u.active).length;
  $('cap').textContent = 'ผู้ใช้ทั้งหมด ' + users.length + ' คน · ใช้งานอยู่ ' + on + ' คน · เข้าสู่ระบบเป็น ' + (me.team || '-');
  $('list').innerHTML = users.length ? users.map((u, i) => {
    const self = u.name.toLowerCase() === me.name.toLowerCase();
    return `<div class="u ${u.active ? '' : 'off'}" data-i="${i}">
      <b>${esc(u.team || '(ยังไม่มี Name)')}</b><span class="tag ${u.role === 'admin' ? '' : 't'}">${u.role === 'admin' ? 'ผู้ดูแล' : 'ช่าง'}</span>${u.active ? '' : '<span class="tag x">ปิดใช้งาน</span>'}${self ? '<span class="tag t">คุณ</span>' : ''}
      <div class="un">CODE: ${esc(u.name)}</div>
      <div class="acts">
        <button class="ghost" data-a="team"><svg class="mi" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>Name</button>
        <button class="ghost" data-a="uname"><svg class="mi" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>CODE</button>
        <button class="ghost" data-a="pin"><svg class="mi" viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="M10.8 12.2L20 3M16 7l3 3M14 9l2 2"/></svg>รหัส</button>
        <button class="ghost" data-a="role"><svg class="mi" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4L3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/></svg>สิทธิ์</button>
        ${self ? '' : `<button class="${u.active ? 'del' : 'ghost'}" data-a="act">${u.active ? '<svg class="mi" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v9M6.3 6.3a8 8 0 1 0 11.4 0"/></svg>ปิด' : '<svg class="mi" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v9M6.3 6.3a8 8 0 1 0 11.4 0"/></svg>เปิด'}</button>`}
      </div></div>`;
  }).join('') : '<p class="empty">ยังไม่มีผู้ใช้</p>';
}

/* ---------- กล่องโต้ตอบ ---------- */
let dlgSubmit = null;
function closeDlg(){ $('dlg').classList.add('hide'); dlgSubmit = null; $('pn').value = ''; $('nm').value = ''; $('tm').value = ''; }
function pinRand(){                       // สร้างรหัสผ่านสุ่ม 12 ตัว (ไม่มีอักขระที่สับสนง่าย)
  const chars = 'abcdefghjkmnpqrstuvwxyzABCDEFGHJKMNPQRSTUVWXYZ23456789';
  const a = new Uint32Array(12); crypto.getRandomValues(a);
  let s = ''; for (let i = 0; i < 12; i++) s += chars[a[i] % chars.length];
  return s;
}
/* cfg: {title, msg, name, pin, role, yes, danger, run(values) -> Promise<{ok,error}>, after(values)} */
function dlg(cfg){
  $('dlgT').textContent = cfg.title; $('dlgM').textContent = cfg.msg || ''; $('dlgM').classList.toggle('hide', !cfg.msg);
  $('fTeam').classList.toggle('hide', !cfg.team);
  $('teams').innerHTML = [...new Set(users.map(u => u.team).filter(Boolean))].map(x => `<option value="${esc(x)}">`).join('');
  $('fName').classList.toggle('hide', !cfg.name); $('fPin').classList.toggle('hide', !cfg.pin); $('fRole').classList.toggle('hide', !cfg.role);
  $('shown').classList.add('hide'); $('dlgE').textContent = ''; $('dlgNo').classList.remove('hide');
  $('nm').value = cfg.nameVal || ''; $('tm').value = cfg.teamVal || ''; $('pn').value = cfg.pin ? pinRand() : ''; $('rl').value = cfg.roleVal || 'tech';
  const y = $('dlgYes'); y.textContent = cfg.yes || 'ตกลง'; y.className = cfg.danger ? 'del' : ''; y.disabled = false;
  $('dlg').classList.remove('hide');
  (cfg.team ? $('tm') : cfg.name ? $('nm') : cfg.pin ? $('pn') : y).focus();
  dlgSubmit = async () => {
    const v = {name: $('nm').value.trim(), team: $('tm').value.replace(/\s+/g, ' ').trim(), pin: $('pn').value.trim(), role: $('rl').value};
    $('dlgE').textContent = ''; y.disabled = true; const old = y.textContent; y.textContent = 'กำลังบันทึก…';
    const j = await cfg.run(v);
    y.disabled = false; y.textContent = old;
    if (!j.ok) { $('dlgE').textContent = j.error || 'ไม่สำเร็จ'; return; }
    if (j.relogin) { endSession('เปลี่ยน CODE แล้ว เข้าระบบใหม่ด้วย ' + j.newName); return; }
    users = j.users; draw();
    if (cfg.showPin) {      /* แสดงรหัสครั้งเดียว: ระบบเก็บเป็น hash ดูย้อนหลังไม่ได้ */
      $('dlgT').textContent = 'สำเร็จ · จดรหัสนี้ไว้';
      $('dlgM').textContent = 'ผู้ใช้: ' + (v.name || cfg.who) + '\nแจ้งให้เข้าระบบด้วยรหัสนี้ ระบบเก็บเป็นรหัสแบบเข้ารหัส ดูซ้ำไม่ได้ ให้ผู้ใช้เปลี่ยนรหัสเองตอนเข้าครั้งแรก';
      $('dlgM').classList.remove('hide');
      ['fTeam','fName','fPin','fRole'].forEach(x => $(x).classList.add('hide'));
      $('shown').textContent = v.pin; $('shown').classList.remove('hide');
      $('dlgNo').classList.add('hide'); y.textContent = 'ปิด'; y.className = '';
      dlgSubmit = () => closeDlg();
    } else closeDlg();
  };
}
$('dlgYes').onclick = () => dlgSubmit && dlgSubmit();
$('dlgNo').onclick = closeDlg;
$('rnd').onclick = () => { $('pn').value = pinRand(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('dlg').classList.contains('hide') && $('shown').classList.contains('hide')) closeDlg(); });

$('add').onclick = () => dlg({
  title: 'เพิ่มผู้ใช้ใหม่', team: true, name: true, pin: true, role: true, yes: 'เพิ่มผู้ใช้', showPin: true,
  run: v => api('user_add', {team: v.team, name: v.name, password: v.pin, role: v.role})
});

$('list').onclick = e => {
  const b = e.target.closest('button[data-a]'); if (!b) return;
  const u = users[+b.closest('.u').dataset.i]; if (!u) return;
  const self = u.name.toLowerCase() === me.name.toLowerCase();
  if (b.dataset.a === 'team') dlg({
    title: 'แก้ไข Name (ทีม)', msg: 'CODE: ' + u.name + '\nงานที่บันทึกไปแล้วยังแสดง Name เดิม (Name ตอนบันทึก) งานใหม่จะใช้ Name นี้',
    team: true, teamVal: u.team, yes: 'บันทึก',
    run: v => v.team === u.team ? Promise.resolve({ok: false, error: 'Name เหมือนเดิม'}) : api('user_edit', {name: u.name, team: v.team})
  });
  if (b.dataset.a === 'uname') dlg({
    title: 'แก้ไข CODE', msg: 'Name: ' + (u.team || '-') + '\nใช้ CODE ใหม่เข้าระบบ รหัสผ่านเดิมยังใช้ได้ ผู้ใช้จะถูกบังคับออกจากระบบ' + (self ? '\n\nนี่คือบัญชีของคุณ ต้องเข้าระบบใหม่หลังบันทึก' : ''),
    name: true, nameVal: u.name, yes: 'บันทึก',
    run: v => v.name === u.name ? Promise.resolve({ok: false, error: 'CODE เหมือนเดิม'}) : api('user_edit', {name: u.name, newName: v.name})
  });
  if (b.dataset.a === 'pin') dlg({
    title: 'ตั้งรหัสผ่านใหม่', msg: 'ผู้ใช้: ' + u.name + '\nรหัสเดิมจะใช้ไม่ได้ ผู้ใช้ต้องตั้งรหัสใหม่ตอนเข้าระบบ และเซสชันเดิมจะถูกบังคับออก',
    pin: true, yes: 'ตั้งรหัส', showPin: true, who: u.name,
    run: v => api('user_edit', {name: u.name, password: v.pin})
  });
  if (b.dataset.a === 'role') dlg({
    title: 'เปลี่ยนสิทธิ์', msg: 'ผู้ใช้: ' + u.name, role: true, roleVal: u.role, yes: 'บันทึก',
    run: v => v.role === u.role ? Promise.resolve({ok: false, error: 'สิทธิ์เหมือนเดิม'}) : api('user_edit', {name: u.name, role: v.role})
  });
  if (b.dataset.a === 'act') dlg({
    title: u.active ? 'ปิดใช้งานผู้ใช้?' : 'เปิดใช้งานผู้ใช้?',
    msg: u.active ? 'ผู้ใช้: ' + u.name + '\nจะเข้าระบบไม่ได้ และถูกบังคับออกจากระบบทันที (ข้อมูลที่เคยบันทึกยังอยู่ครบ)' : 'ผู้ใช้: ' + u.name + '\nจะกลับมาเข้าระบบได้ด้วยรหัสเดิม',
    yes: u.active ? 'ปิดใช้งาน' : 'เปิดใช้งาน', danger: u.active,
    run: () => api('user_active', {name: u.name, active: !u.active})
  });
};

load(); pendingBadge();

/* ไอคอนบทบาท + ป้าย CHEF / COOK บนหัวเว็บ */
const ROLE_IC = {"cook": "M11 13 a4.6 4.6 0 0 1 1.6-8.8 a5.4 5.4 0 0 1 9.8 0 a4.6 4.6 0 0 1 1.6 8.8 z M11 13 v3.2 h14 v-3.2 M4.5 21 h27 a1.5 1.5 0 0 1 1.5 1.5 v7.5 a1.5 1.5 0 0 1 -1.5 1.5 h-27 a1.5 1.5 0 0 1 -1.5 -1.5 v-7.5 a1.5 1.5 0 0 1 1.5 -1.5 z M8.5 26.2 h.01 M12.5 26.2 h.01 M16.5 26.2 h.01 M23.5 26.2 h4.5 M8 21 l-2.4-3.4 M28 21 l2.4-3.4", "chef": "M11 13 a4.6 4.6 0 0 1 1.6-8.8 a5.4 5.4 0 0 1 9.8 0 a4.6 4.6 0 0 1 1.6 8.8 z M11 13 v3.2 h14 v-3.2 M5 19.5 h26 a1.5 1.5 0 0 1 1.5 1.5 v9 a1.5 1.5 0 0 1 -1.5 1.5 h-26 a1.5 1.5 0 0 1 -1.5 -1.5 v-9 a1.5 1.5 0 0 1 1.5 -1.5 z M13.5 35 h9 M18 31.5 v3.5 M13.5 25.5 l3 3 6-6"};
function cxBrand(u){
  const role = u ? (u.role === 'admin' ? 'chef' : 'cook') : '';
  document.querySelectorAll('header.cx .cx-role').forEach(el => { el.textContent = role ? role.toUpperCase() : ''; });
  document.querySelectorAll('header.cx .cx-gear').forEach(g => {
    if (!g.dataset.gear) { g.dataset.gear = g.innerHTML; g.dataset.vb = g.getAttribute('viewBox'); }
    if (role) { g.setAttribute('viewBox', '0 0 36 36'); g.innerHTML = '<path d="' + ROLE_IC[role] + '"/>'; g.classList.add('cx-roleic'); }
    else { g.setAttribute('viewBox', g.dataset.vb); g.innerHTML = g.dataset.gear; g.classList.remove('cx-roleic'); }
  });
}
cxBrand(typeof me !== "undefined" ? me : null);
